name: Bug report
description: Something is broken in the portal, the pipeline or the infrastructure.
title: "[Bug] "
labels: ["type:bug", "status:triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Citizen UI, Officer UI, API, Pipeline (Jenkins), Docker, Ansible, Selenium suite, Docs]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /apply
        2. Upload a 3 MB PDF
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Shown in the footer and at /actuator/info
      placeholder: 1.0.0 (a1b2c3d)
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [local, staging, production, ansible-node]
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, Jenkins build link
      render: shell
