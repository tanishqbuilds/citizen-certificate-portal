# Sanad CI/CD toolchain: Jenkins controller, Tomcat 11 deployment target and a Selenium Grid.
#   scripts/ci-up.sh      creates ci/.env (random secrets) and starts everything
#   docker compose -f ci/docker-compose.yml --env-file ci/.env down
name: ccrp-ci

services:
  jenkins:
    build: ./jenkins
    image: sanad/jenkins:2.580.1
    container_name: ccrp-jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"
    env_file: .env
    group_add:
      - "${DOCKER_GID}"          # access to the host Docker socket
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ccrp-ci]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 20

  tomcat:
    build: ../infra/tomcat
    image: sanad/tomcat:11.0.26
    container_name: ccrp-tomcat
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      TOMCAT_DEPLOYER_PASSWORD: "${TOMCAT_DEPLOYER_PASSWORD}"
    volumes:
      - tomcat_data:/usr/local/tomcat/data
    networks: [ccrp-ci]

  selenium:
    image: selenium/standalone-chrome:4.49.0-20260909
    container_name: ccrp-selenium
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "4444:4444"   # Grid UI/API
      - "7900:7900"   # noVNC: watch the browser at http://localhost:7900 (password: secret)
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: "120"
      SE_SCREEN_WIDTH: "1440"
      SE_SCREEN_HEIGHT: "900"
    networks: [ccrp-ci]

volumes:
  jenkins_home:
  tomcat_data:

networks:
  ccrp-ci:
    name: ccrp-ci
