# ---------------------------------------------------------------------------
# Sanad — Citizen Certificate Request Portal
# Defaults are safe for local development. Every key can be overridden by an
# environment variable (relaxed binding), e.g. APP_ENVIRONMENT, APP_DATA_DIR,
# APP_OFFICER_PASSWORD, SERVER_PORT.
# ---------------------------------------------------------------------------
spring:
  application:
    name: ccrp
  datasource:
    url: jdbc:h2:file:${app.data-dir}/db/ccrp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # Transport limit. The business limit (app.documents.max-size) is enforced with a friendly message.
      max-file-size: 10MB
      max-request-size: 11MB
  thymeleaf:
    cache: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # Keep reading oversized uploads so the user gets a friendly page instead of a connection reset.
    max-swallow-size: 20MB
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: simple
    java:
      enabled: true
    env:
      enabled: true

info:
  app:
    name: Sanad — Citizen Certificate Request Portal
    environment: ${app.environment}

app:
  environment: local
  data-dir: ./data
  documents:
    max-size: 2MB
  officer:
    username: officer
    # Local default only. Staging/production inject APP_OFFICER_PASSWORD.
    password: ${APP_OFFICER_PASSWORD:Officer@123}

logging:
  level:
    root: INFO
    com.sanad.portal: INFO
